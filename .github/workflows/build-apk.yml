name: Build APK
on:
  push:
    branches: [ arena/**, lineage-*, main ]
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: 'zulu', java-version: 17, cache: 'gradle' }
      - run: chmod +x ./gradlew
      - name: Accept Android SDK licenses (best effort)
        run: set +e; yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1; exit 0
      - run: |
          set +e
          ./gradlew assembleDebug --stacktrace > build_log.txt 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            grep -E "e: |error: |AAPT: |FAILURE: |Execution failed " build_log.txt | head -n 10 | while IFS= read -r line; do
              echo "::error title=BuildError::$line"
            done
            tail -n 5 build_log.txt | while IFS= read -r line; do
              echo "::error title=Tail::$line"
            done
            exit $RC
          fi
      - uses: actions/upload-artifact@v7
        with: { name: glimpse-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk, if-no-files-found: error }

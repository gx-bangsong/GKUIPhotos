name: production release

on:
  push:
    branches: [ "main", "master", "lineage-23.2" ]
    paths-ignore: [ 'docs/**', '**/*.md' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android build-tools
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$SDK/build-tools/35.0.0"
          if [ ! -x "$BT/aapt" ]; then
            SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" 'build-tools;35.0.0'
          fi
          echo "$BT" >> "$GITHUB_PATH"

      - name: Build and validate the production APK
        id: build
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASS }}
          GH_TOKEN: ${{ github.token }}
          CI: 'true'
        run: scripts/ci-build.sh

      - name: Prepare release notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Production APK
          - applicationId: `${{ steps.build.outputs.application_id }}`
          - versionCode: `${{ steps.build.outputs.version_code }}`
          - versionName: `${{ steps.build.outputs.version_name }}`
          - signer SHA-256: `${{ steps.build.outputs.signer_sha256 }}`
          - APK SHA-256: `${{ steps.build.outputs.apk_sha256 }}`
          - source: ${{ steps.build.outputs.source_url }}
          NOTES

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.build.outputs.tag }}' dist/* \
            --title '${{ steps.build.outputs.tag }}' \
            --notes-file "$RUNNER_TEMP/release-notes.md"

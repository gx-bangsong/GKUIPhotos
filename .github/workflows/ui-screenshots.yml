# Capture synthetic Android editor scenarios and run lint without release credentials.
# SPDX-FileCopyrightText: The LineageOS Project
# SPDX-License-Identifier: Apache-2.0
name: UI screenshots
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - name: Run Android lint
        run: |
          set +e
          ./gradlew :app:lintDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/lint-gradle.log"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            python3 scripts/report-ui-diagnostics.py --log "$RUNNER_TEMP/lint-gradle.log" \
              --lint app/build/reports/lint-results-debug.xml
          fi
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
  screenshots:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [baseline, candidate]
        mode: [light, dark]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Restore baseline product sources (keep current test harness)
        if: matrix.version == 'baseline'
        run: |
          rm -rf app/src/main
          git archive 936f0a85fe3a62b18dfb19fc65ff3234895f914f app/src/main | tar -x
          git diff --exit-code 936f0a85fe3a62b18dfb19fc65ff3234895f914f -- app/src/main
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - name: Enable KVM for hosted emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation on API 34
        uses: reactivecircus/android-emulator-runner@v2
        env:
          UI_MODE: ${{ matrix.mode }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: scripts/run-ui-screenshots.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-${{ matrix.version }}-${{ matrix.mode }}
          path: ui-evidence/
          if-no-files-found: warn
